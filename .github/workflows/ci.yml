# P0 — CI for prop_plus_price_model_service (see PropPlus docs/testing/TEST_STRATEGY.md)
# Runs the node:test suite (test/features.test.js — pure functions, no model download).
name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        # --ignore-scripts: skip onnxruntime-node's binary postinstall download —
        # the unit tests import src/features.js only and never load the runtime.
        run: npm ci --ignore-scripts

      # ADR-030: grep the case count so a test file that disappears or
      # self-skips turns the run red instead of looking like "everything
      # passed". Update the number here in the same commit that changes the
      # suite — that is the intended human checkpoint, not an annoyance.
      - name: Run tests
        shell: bash # gives -o pipefail, so `| tee` cannot swallow the exit code
        run: |
          npm test | tee "$RUNNER_TEMP/unit.log"
          grep -qE '^# pass 20$'   "$RUNNER_TEMP/unit.log"
          grep -qE '^# fail 0$'    "$RUNNER_TEMP/unit.log"
          grep -qE '^# skipped 0$' "$RUNNER_TEMP/unit.log"
